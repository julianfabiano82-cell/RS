<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SLC Demand Board</title>
<meta name="description" content="Hourly rideshare demand gauges for Salt Lake City areas and venues.">
<meta name="theme-color" content="#0d1012">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SLC Demand">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root {
    --bg: #0d1012; --panel: #151a1d; --panel-2: #1c2226; --line: #283036;
    --text: #eef2f3; --muted: #a5b1b7; --k: 1;
    --high: #22c55e; --high-bg: rgba(34,197,94,.16);
    --med: #f2b33d;  --med-bg: rgba(242,179,61,.16);
    --low: #66717a;  --low-bg: rgba(102,113,122,.22);
    --bad: #f26b5b;  --bad-bg: rgba(242,107,91,.16);
    --radius: 18px; --tap: 48px;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    --head: calc(108px + var(--sat));
  }
  :root[data-theme="light"] {
    --bg: #f3f5f6; --panel: #ffffff; --panel-2: #f1f4f5; --line: #dbe1e4;
    --text: #11171b; --muted: #5b676e;
    --high: #138a3f; --high-bg: rgba(19,138,63,.13);
    --med: #b87a06;  --med-bg: rgba(184,122,6,.13);
    --low: #8f9aa1;  --low-bg: rgba(143,154,161,.22);
    --bad: #c43d2f;  --bad-bg: rgba(196,61,47,.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; }
  body.sheet-open { overflow: hidden; }

  /* ---------- Top bar ---------- */
  header { position: sticky; top: 0; z-index: 20; flex-wrap: wrap;
    padding: calc(10px + var(--sat)) calc(16px + var(--sar)) 10px calc(16px + var(--sal));
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .brand { font-weight: 800; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--high); box-shadow: 0 0 0 4px var(--high-bg); }
  .dot.stale { background: var(--med); box-shadow: 0 0 0 4px var(--med-bg); }
  .spacer { flex: 1; }
  .icon-btn { width: var(--tap); height: var(--tap); margin: -6px -10px -6px 0; border: 0; background: none;
    display: grid; place-items: center; border-radius: 12px; cursor: pointer; }
  .icon-btn:active { background: var(--panel-2); }
  .clock { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 700;
    color: var(--muted); white-space: nowrap; letter-spacing: .02em; }
  .status { font-size: 12px; color: var(--muted); padding: 6px calc(16px + var(--sar)) 0 calc(16px + var(--sal)); max-width: 1100px; margin: 0 auto; }

  main { padding: 8px calc(10px + var(--sar)) calc(110px + var(--sab)) calc(10px + var(--sal)); max-width: 1100px; margin: 0 auto; }

  /* ---------- Hot now ---------- */
  .hot { display: flex; gap: 8px; overflow-x: auto; margin: 4px -10px 12px; padding: 2px 10px; scrollbar-width: none; }
  .hot::-webkit-scrollbar { display: none; }
  .hot .lbl { flex: 0 0 auto; align-self: center; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .pill { flex: 0 0 auto; border: 1px solid color-mix(in srgb, var(--high) 50%, var(--line)); background: var(--high-bg);
    color: var(--text); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .pill b { color: var(--high); margin-left: 4px; }
  .ahead { flex: 0 0 auto; align-self: center; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    color: var(--med); background: var(--med-bg); padding: 4px 10px; border-radius: 999px; }

  /* ---------- Area row: big gauge left, mini gauges right ---------- */
  .area { display: grid; grid-template-columns: 146px minmax(0, 1fr); gap: 8px; align-items: start;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; margin-bottom: 12px; }
  .area.high { border-color: color-mix(in srgb, var(--high) 45%, var(--line)); }
  .big { position: sticky; top: calc(var(--head) + 8px); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px 6px 12px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
  .big:active { transform: scale(.98); }
  .big h2 { margin: 0; font-size: 15px; font-weight: 800; }
  .big svg { width: 100%; max-width: 200px; margin-top: 4px; overflow: visible; }
  .g-val { font-size: 34px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: -2px; }
  .g-lvl { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
  .g-peak { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .g-trend { font-size: 12px; color: var(--muted); }
  .g-more { font-size: 11px; color: var(--muted); margin-top: 8px; }

  .minis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .mini { border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 6px 4px 8px;
    text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; min-height: 104px; }
  .mini:active { transform: scale(.97); }
  .mini.high { border-color: color-mix(in srgb, var(--high) 60%, var(--line)); background: color-mix(in srgb, var(--high-bg) 60%, var(--panel-2)); }
  .mini svg { width: 100%; max-width: 78px; overflow: visible; }
  .mini .n { font-size: 12px; font-weight: 650; line-height: 1.2; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mini .t { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .more { grid-column: 1 / -1; border: 1px dashed var(--line); background: none; border-radius: 12px; min-height: 40px;
    font-size: 13px; color: var(--muted); cursor: pointer; }

  /* ---------- Alerts ---------- */
  .alerts { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 4px -10px 0; padding: 0 10px 4px; scrollbar-width: none; }
  .alerts::-webkit-scrollbar { display: none; }
  .alert { flex: 0 0 82%; max-width: 340px; scroll-snap-align: start; background: var(--panel); border: 1px solid var(--line);
    border-left: 4px solid var(--med); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .alert b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .alert .d { color: var(--muted); font-size: 13px; }
  .foot { font-size: 12px; color: var(--muted); text-align: center; margin: 22px 8px 0; }

  /* ---------- Bottom hour bar ---------- */
  .hourbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 10px calc(12px + var(--sar)) calc(10px + var(--sab)) calc(12px + var(--sal));
    background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line); }
  .hourbar .row { display: flex; align-items: center; gap: 8px; max-width: 1100px; margin: 0 auto; }
  .step { width: 56px; height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2); font-size: 22px; cursor: pointer; }
  .step:active { background: var(--line); }
  .hourlbl { flex: 1; text-align: center; }
  .hourlbl .h { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .hourlbl .sub { font-size: 12px; color: var(--muted); }
  .now { height: 52px; padding: 0 16px; border-radius: 14px; border: 0; background: var(--high); color: #06210f; font-weight: 800; cursor: pointer; }
  .now[disabled] { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }

  /* ---------- Bottom sheet ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-height: 88vh; max-height: 88dvh;
    background: var(--bg); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0;
    transform: translateY(102%); visibility: hidden; transition: transform .25s ease, visibility 0s linear .25s; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; }
  body.sheet-open .backdrop { opacity: 1; pointer-events: auto; }
  body.sheet-open .sheet { transform: none; visibility: visible; transition: transform .25s ease, visibility 0s; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: 8px 16px 10px; }
  .sheet-head h3 { margin: 0; font-size: 19px; line-height: 1.2; }
  .sheet-head .sub { font-size: 12px; color: var(--muted); }
  .badge { font-weight: 800; padding: 2px 10px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
  .sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 calc(14px + var(--sar)) calc(20px + var(--sab)) calc(14px + var(--sal)); }
  .why { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 14px; margin-bottom: 10px; }
  .why ul { margin: 4px 0 0; padding-left: 18px; }
  .why .src { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .venue { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
    display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; margin-bottom: 8px; }
  .venue svg { width: 64px; overflow: visible; }
  .venue h4 { margin: 0; font-size: 15px; }
  .venue .peak { font-size: 13px; color: var(--muted); }
  .venue .note { font-size: 13px; margin-top: 2px; }
  .hero { text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .hero svg { width: 200px; max-width: 70%; overflow: visible; }
  .strip { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; align-items: end; height: 24px; margin-top: 8px; }
  .strip.tall { height: 56px; }
  .strip i { display: block; border-radius: 2px; min-height: 3px; }
  .strip i.sel { outline: 2px solid var(--text); outline-offset: 1px; }
  .axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* ---------- Menu ---------- */
  .menu { position: fixed; top: calc(56px + var(--sat)); right: calc(10px + var(--sar)); z-index: 60; min-width: 220px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px; display: none; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  .menu.open { display: block; }
  .menu button, .menu a { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: var(--tap);
    padding: 0 12px; border: 0; background: none; border-radius: 10px; text-decoration: none; font-size: 15px; cursor: pointer; text-align: left; color: var(--text); }
  .menu button:active, .menu a:active { background: var(--panel-2); }
  .menu .who { font-size: 12px; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px; word-break: break-all; }
  .toggle { font-size: 12px; color: var(--muted); }



  /* ---------- Compass around Temple Square ---------- */
  .compass-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; margin-bottom: 14px; }
  .compass-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px; }
  .compass-head b { font-size: 15px; }
  .compass-head span { font-size: 12px; color: var(--muted); }
  .compass { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .cell { border: 1px solid var(--line); background: var(--panel-2); border-radius: 14px; padding: 6px 4px 8px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; text-align: center; min-height: 112px; }
  .cell:active { transform: scale(.97); }
  .cell.high { border-color: color-mix(in srgb, var(--high) 60%, var(--line)); background: color-mix(in srgb, var(--high-bg) 60%, var(--panel-2)); }
  .cell svg { width: 100%; max-width: 84px; overflow: visible; }
  .cell .dir { font-size: 10px; font-weight: 800; letter-spacing: .1em; color: var(--muted); }
  .cell .n { font-size: 12px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
  .cell .d { font-size: 10px; color: var(--muted); }
  .cell.center { border-style: dashed; border-color: var(--muted); }
  .area { scroll-margin-top: calc(var(--head) + 12px); }
  .area.flash { animation: flash 1.2s ease; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--high); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .big .dirtag { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .big .dirtag b { color: var(--text); letter-spacing: .06em; }
  @media (min-width: 760px) { .cell { min-height: 130px; } .cell svg { max-width: 110px; } .cell .n { font-size: 14px; } }


  /* ---------- Loops strip (top of page) ---------- */
  .loops-head { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 4px 8px; }
  .loops-head b { font-size: calc(17px * var(--k)); }
  .loops-head span { font-size: calc(13px * var(--k)); color: var(--muted); }
  .loops { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -10px 12px; padding: 2px 10px 6px; scrollbar-width: none; }
  .loops::-webkit-scrollbar { display: none; }
  .loop { flex: 0 0 172px; scroll-snap-align: start; border: 1px solid var(--line); background: var(--panel); border-radius: 16px;
    padding: 10px 10px 12px; cursor: pointer; display: flex; flex-direction: column; text-align: left; }
  .loop:active { transform: scale(.98); }
  .loop.high { border-color: color-mix(in srgb, var(--high) 55%, var(--line)); }
  .loop svg.g { width: 100%; max-width: 132px; align-self: center; margin-top: 6px; overflow: visible; }
  .loop .lv { align-self: center; font-size: calc(28px * var(--k)); font-weight: 800; line-height: 1; margin-top: -2px; font-variant-numeric: tabular-nums; }
  .loop .meta { margin-top: 6px; text-align: center; }
  .loop .back { margin-top: 6px; display: flex; justify-content: center; align-items: center; gap: 6px; font-size: calc(13px * var(--k)); }
  .loop .back i { font-style: normal; font-weight: 800; padding: 1px 8px; border-radius: 999px; }
  .ring { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: center; min-height: 44px; }
  .ring svg { width: 22px; height: 22px; color: var(--text); }
  .ring .to { font-size: calc(16px * var(--k)); font-weight: 800; line-height: 1.2; }
  .ring .from { font-size: calc(12px * var(--k)); color: var(--muted); }
  .legs { display: grid; gap: 10px; }
  .legs .lbl { font-size: calc(12px * var(--k)); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: left; }
  @media (min-width: 900px) { .loops { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); overflow: visible; margin: 0 0 12px; padding: 0; } }
  :root[data-text="large"] .loop { flex-basis: 196px; }


  /* ---------- LOOPS: center of the site ---------- */
  .best { background: var(--panel); border: 1px solid color-mix(in srgb, var(--high) 55%, var(--line)); border-radius: 20px;
    padding: 14px; margin-bottom: 14px; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; align-items: center; cursor: pointer;
    width: 100%; text-align: left; }
  .best.med { border-color: color-mix(in srgb, var(--med) 55%, var(--line)); }
  .best.low { border-color: var(--line); }
  .best .eyebrow { grid-column: 1 / -1; font-size: calc(12px * var(--k)); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--high); }
  .best.med .eyebrow { color: var(--med); } .best.low .eyebrow { color: var(--muted); }
  .best .gz { text-align: center; }
  .best .gz svg { width: 100%; overflow: visible; }
  .best .gz .v { font-size: calc(40px * var(--k)); font-weight: 800; line-height: 1; margin-top: -4px; font-variant-numeric: tabular-nums; }
  .best .gz .u { font-size: calc(11px * var(--k)); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
  .best .info { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .best .info .ring .to, .best .info .route .to { font-size: calc(19px * var(--k)); }
  .legpills { display: flex; flex-wrap: wrap; gap: 6px; }
  .legpill { font-size: calc(13px * var(--k)); padding: 3px 10px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
  .best .sub { font-size: calc(14px * var(--k)); color: var(--muted); }
  .runner { display: flex; gap: 6px; flex-wrap: wrap; grid-column: 1 / -1; }
  .runner span { font-size: calc(12px * var(--k)); color: var(--muted); align-self: center; }

  .lgroup { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; margin-bottom: 12px; scroll-margin-top: calc(var(--head) + 12px); }
  .lgroup.flash { animation: flash 1.2s ease; }
  .lgroup-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 2px 4px 8px; }
  .lgroup-h b { font-size: calc(17px * var(--k)); }
  .lgroup-h span { font-size: calc(13px * var(--k)); color: var(--muted); white-space: nowrap; }
  .lrows { display: grid; gap: 6px; }
  .lrow { display: grid; grid-template-columns: 64px minmax(0, 1fr) 14px; gap: 12px; align-items: center; min-height: 68px;
    border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 8px 12px; cursor: pointer; text-align: left; width: 100%; }
  .lrow:active { transform: scale(.98); }
  .lrow.high { border-color: color-mix(in srgb, var(--high) 60%, var(--line)); background: color-mix(in srgb, var(--high-bg) 55%, var(--panel-2)); }
  .lrow svg { width: 64px; overflow: visible; }
  .lrow .t1 { font-size: calc(16px * var(--k)); font-weight: 750; line-height: 1.25; }
  .lrow .t1 .arr { color: var(--muted); font-weight: 600; }
  .lrow .t2 { font-size: calc(13px * var(--k)); color: var(--muted); margin-top: 3px; }
  .lrow .t2 b { font-weight: 800; }
  .lrow .chev { color: var(--muted); font-size: 18px; }
  @media (min-width: 640px) {
    .best { grid-template-columns: 220px minmax(0, 1fr); padding: 18px 20px; }
    .lrows { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  }


  /* ---------- Small loop gauges grid ---------- */
  .ltiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .ltile { border: 1px solid var(--line); background: var(--panel-2); border-radius: 14px; padding: 6px 4px 8px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1px; }
  .ltile:active { transform: scale(.97); }
  .ltile.high { border-color: color-mix(in srgb, var(--high) 60%, var(--line)); background: color-mix(in srgb, var(--high-bg) 60%, var(--panel-2)); }
  .ltile svg { width: 100%; max-width: 80px; overflow: visible; }
  .ltile .n { font-size: calc(13px * var(--k)); font-weight: 750; line-height: 1.2; }
  .ltile .n .arr { color: var(--muted); font-weight: 600; }
  .ltile .s { font-size: calc(11.5px * var(--k)); color: var(--muted); margin-top: 2px; }
  .tiles-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; margin-bottom: 14px; }
  .strip-tiles { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -10px 12px; padding: 2px 10px 6px; scrollbar-width: none; }
  .strip-tiles::-webkit-scrollbar { display: none; }
  .strip-tiles .ltile { flex: 0 0 116px; scroll-snap-align: start; background: var(--panel); }
  .strip-tiles .ltile.high { background: color-mix(in srgb, var(--high-bg) 60%, var(--panel)); }
  @media (max-width: 420px) { :root[data-text="large"] .ltiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 640px) { .ltiles { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); } .ltile svg { max-width: 96px; } }


  /* ---------- Places to avoid ---------- */
  .avoid-wrap { background: var(--panel); border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); border-radius: var(--radius); padding: 10px; margin-bottom: 14px; }
  .avoid-wrap .compass-head b { color: var(--bad); }
  .explain { font-size: calc(13px * var(--k)); color: var(--muted); margin: -2px 2px 10px; line-height: 1.4; }

/* ---------------- helpers ---------------- */
const HIGH = 70, MED = 45, REFRESH_MS = 15 * 60 * 1000, MINI_BASE = 6;
const miniLimit = () => matchMedia("(min-width: 760px)").matches ? 12 : MINI_BASE;
const $ = id => document.getElementById(id);
const level = s => s >= HIGH ? "high" : s >= MED ? "med" : "low";
const LEVEL_TEXT = { high: "High demand", med: "Moderate", low: "Low" };
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const color = lv => cssVar(lv === "high" ? "--high" : lv === "med" ? "--med" : "--low");
const bgVar = lv => cssVar(lv === "high" ? "--high-bg" : lv === "med" ? "--med-bg" : "--low-bg");
const fmtHour = h => `${h % 12 || 12} ${h < 12 ? "AM" : "PM"}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

function peakWindow(h) {
  let best = 0; h.forEach((v, i) => { if (v > h[best]) best = i; });
  if (h[best] < HIGH) return `Best ~${fmtHour(best)}`;
  let s = best, e = best;
  while (s > 0 && h[s - 1] >= HIGH) s--;
  while (e < 23 && h[e + 1] >= HIGH) e++;
  return `Peak ${fmtHour(s)}–${fmtHour((e + 1) % 24)}`;
}
const tz = () => (DATA && DATA.timezone) || "America/Denver";
function currentHour() {
  try { return Number(new Intl.DateTimeFormat("en-US", { hour: "numeric", hourCycle: "h23", timeZone: tz() }).format(new Date())); }
  catch { return new Date().getHours(); }
}

/* Auto-follow window 08:00-23:59 SLC: the board only moves on its own inside this window */
const inWindow = () => { const h = currentHour(); return h >= 8 && h <= 23; };
let firstLoad = true;

/* Semicircle gauge. "lg" = needle + bands; "sm" = number inside the arc */
function gaugeSVG(score, size, mode) {
  const lg = size === "lg", R = 80, cx = 100, cy = 100, sw = lg ? 18 : 22;
  const pt = v => { const a = Math.PI * (1 - v / 100); return [cx + R * Math.cos(a), cy - R * Math.sin(a)]; };
  const arc = (a, b) => { const [x1, y1] = pt(a), [x2, y2] = pt(b); return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  const lv = level(score), c = mode === "avoid" ? avoidColor(score) : color(lv), [nx, ny] = pt(score);
  const bands = `<path d="${arc(0, MED)}" stroke="${mode === "avoid" ? cssVar("--bad-bg") : bgVar("low")}" stroke-width="${sw}" fill="none"/>
    <path d="${arc(MED, HIGH)}" stroke="${bgVar("med")}" stroke-width="${sw}" fill="none"/>
    <path d="${arc(HIGH, 100)}" stroke="${bgVar("high")}" stroke-width="${sw}" fill="none"/>`;
  const val = score > 0 ? `<path d="${arc(0, Math.min(score, 99.9))}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" fill="none"/>` : "";
  const wash = `<path d="${arc(0, 100)}" stroke="${c}" stroke-width="${sw}" fill="none" opacity="0.38"/>`;
  const glow = score > 0 ? `<path d="${arc(0, Math.min(score, 99.9))}" stroke="${c}" stroke-width="${sw + 14}" fill="none" opacity="0.30" stroke-linecap="round"/>` : "";
  const center = lg
    ? `<line x1="${cx}" y1="${cy}" x2="${(cx + (nx - cx) * .76).toFixed(1)}" y2="${(cy + (ny - cy) * .76).toFixed(1)}" stroke="${cssVar("--text")}" stroke-width="4" stroke-linecap="round"/>
       <circle cx="${cx}" cy="${cy}" r="7" fill="${cssVar("--text")}"/>`
    : `<text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="46" font-weight="800" fill="${c}" font-family="system-ui,-apple-system,sans-serif">${score}</text>`;
  return `<svg viewBox="0 6 200 ${lg ? 106 : 104}" role="img" aria-label="Demand ${score} of 100">${bands}${wash}${glow}${val}${center}</svg>`;
}
function stripHTML(h, sel, tall) {
  const max = Math.max(...h, 1);
  return `<div class="strip ${tall ? "tall" : ""}">${h.map((v, i) =>
    `<i class="${i === sel ? "sel" : ""}" style="height:${Math.max(8, v / max * 100)}%;background:${color(level(v))}"></i>`).join("")}</div>
    <div class="axis"><span>12A</span><span>6A</span><span>12P</span><span>6P</span><span>11P</span></div>`;
}


const ARROW = `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 11 L1.5 5 H4.5 V1 H7.5 V5 H10.5 Z" fill="currentColor"/></svg>`;
const routeTitle = r => `<div class="route"><div class="rail"><i></i><b></b>${ARROW}</div>
  <div class="from">${esc(r.from)}</div><div class="to">${esc(r.to)}</div></div>`;
const trendTxt = (h) => { const s = h[hour], n = h[(hour + 1) % 24], d = n - s;
  return d > 4 ? `▲ ${n} next hr` : d < -4 ? `▼ ${n} next hr` : `— ${n} next hr`; };
const byScore = arr => arr.slice().sort((a, b) => b.hourly[hour] - a.hourly[hour]);
function gcard(item, kind) {
  const s = item.hourly[hour], lv = level(s);
  const title = kind === "route" ? routeTitle(item) : `<h2>${esc(item.name)}</h2>`;
  const meta = kind === "route" ? `<div class="meta">~${item.miles} mi · ~${item.minutes} min</div>` : (item.note ? `<div class="meta">${esc(item.note)}</div>` : "");
  const label = kind === "route" ? `${item.from} to ${item.to}` : item.name;
  return `<button class="gcard ${lv}" data-${kind === "route" ? "r" : "n"}="${esc(item.id)}" aria-label="${esc(label)}: ${s}, ${LEVEL_TEXT[lv]}">
    ${title}${gaugeSVG(s, "lg").replace("<svg ", '<svg class="g" ')}
    <div class="g-val" style="color:${color(lv)}">${s}</div>
    <div class="g-lvl" style="color:${color(lv)}">${LEVEL_TEXT[lv]}</div>
    ${meta}<div class="g-peak">${peakWindow(item.hourly)}</div><div class="g-trend">${trendTxt(item.hourly)}</div></button>`;
}
function setTab(t) {
  tab = t; store.set("tab2", t);
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  ["loops", "areas", "routes"].forEach(id => { $(id).hidden = id !== t; });

}

const LOOP_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>`;
function loopTitle(l) {
  return l.from === l.to
    ? `<div class="ring">${LOOP_ICON}<div><div class="from">Loop within</div><div class="to">${esc(l.to)}</div></div></div>`
    : routeTitle(l);
}
const loopAt = (l, h) => l.back ? Math.round((l.hourly[h] + l.back[h]) / 2) : l.hourly[h];
const loopSeries = l => l.hourly.map((_, h) => loopAt(l, h));
const pill = (label, v) => { const lv = level(v); return `<span class="legpill" style="background:${bgVar(lv)};color:${color(lv)}">${label} ${v}</span>`; };
const loopName = l => l.from === l.to ? `${l.to} loop` : `${l.from} → ${l.to}`;
function loopCard(l) {
  const s = loopAt(l, hour), lv = level(s);
  const back = l.back ? l.back[hour] : null, bl = back !== null ? level(back) : null;
  return `<button class="loop ${lv}" data-l="${esc(l.id)}" aria-label="${esc(l.from)} to ${esc(l.to)}: ${s}">

    ${back !== null ? `<div class="back">Out <i style="background:${bgVar(level(l.hourly[hour]))};color:${color(level(l.hourly[hour]))}">${l.hourly[hour]}</i> Back <i style="background:${bgVar(bl)};color:${color(bl)}">${back}</i></div>`
                    : `<div class="back">Stays in zone</div>`}
  </button>`;
}

/* ---------------- state ---------------- */
let DATA = null, hour = 0, followNow = true, sheet = null, wakeLock = null, tab = ["loops", "areas", "routes"].includes(store.get("tab2")) ? store.get("tab2") : "loops";
const expanded = new Set();

async function fetchData() {
  try {
    const r = await fetch("data/zones.json", { cache: "no-store" });
    if (!r.ok) throw 0;
    const j = await r.json();
    store.set("zones-cache", JSON.stringify(j));
    return { data: j, mode: j.sample ? "sample" : "live" };
  } catch {
    const c = store.get("zones-cache");
    if (c) { try { return { data: JSON.parse(c), mode: "cached" }; } catch {} }
    return { data: SAMPLE, mode: "sample" };
  }
}

async function load() {
  const { data, mode } = await fetchData();
  DATA = data;
  if (followNow && (firstLoad || inWindow())) hour = currentHour();
  firstLoad = false;
  const when = new Date(DATA.generated_at).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit", timeZone: tz() });
  $("status").textContent = mode === "live" ? `Updated ${when}` : mode === "cached" ? `Offline · data from ${when}` : `Sample data · ${when}`;
  $("dot").classList.toggle("stale", mode !== "live");
  $("alerts").innerHTML = (DATA.alerts || []).map(a =>
    `<div class="alert"><b>${esc(a.type)}</b>${esc(a.title)}<div class="d">${esc(a.detail || "")}</div></div>`).join("");
  render();
}

const areasOfV = v => [].concat(v.area);
const venuesOf = id => (DATA.venues || []).map((v, i) => ({ ...v, _i: i })).filter(v => areasOfV(v).includes(id));

const COMPASS = ["NW", "N", "NE", "W", "C", "E", "SW", "S", "SE"];

const areaRow = a => {
    const s = a.hourly[hour], lv = level(s), next = a.hourly[(hour + 1) % 24], d = next - s;
    const trend = d > 4 ? `▲ ${next} next hr` : d < -4 ? `▼ ${next} next hr` : `— ${next} next hr`;
    const vs = venuesOf(a.id).sort((x, y) => y.hourly[hour] - x.hourly[hour]);
    const shown = expanded.has(a.id) ? vs : vs.slice(0, miniLimit());

        ${shown.map(v => { const vs_ = v.hourly[hour], vl = level(vs_);

function loopRow(l) {

let avoidExpanded = false;

function renderLoopsTab() {

    <div class="compass">${COMPASS.map(d => { const a = byDir[d], l = a && bestOf(a.id); if (!l) return `<div></div>`;
      const v = loopAt(l, hour), vl = level(v);
      return `<button class="cell ${vl} ${d === "C" ? "center" : ""}" data-ljump="${esc(a.id)}" aria-label="${esc(a.name)}: ${esc(loopName(l))} ${v}">
        <span class="dir">${d === "C" ? "TEMPLE SQUARE" : d}</span>${gaugeSVG(v, "sm")}<span class="n">${esc(a.short || a.name)}</span>
        <span class="d">${l.from === l.to ? "↻ in zone" : "→ " + esc(l.to)}</span></button>`; }).join("")}</div></div>`;
  const order = COMPASS.map(d => byDir[d]).filter(Boolean).sort((x, y) => (x.direction === "C" ? -1 : y.direction === "C" ? 1 : 0));
  const groups = order.map(a => { const ls = all.filter(l => l.zone === a.id).sort((x, y) => loopAt(y, hour) - loopAt(x, hour)); if (!ls.length) return "";
    return `<section class="lgroup" id="lg-${esc(a.id)}"><div class="lgroup-h"><b>From ${esc(a.name)}</b><span>${a.direction === "C" ? "Center" : a.direction} · ${esc(a.drive || "")}</span></div>
      <div class="lrows">${ls.map(loopRow).join("")}</div></section>`; }).join("");
  const av = (DATA.avoid || []).slice().sort((a, b) => a.hourly[hour] - b.hourly[hour]);
  const avShown = avoidExpanded ? av : av.slice(0, 9);
  const avoidHTML = av.length ? `<div class="avoid-wrap"><div class="compass-head"><b>${hour === currentHour() ? "Places to avoid now" : "Places to avoid at " + fmtHour(hour)}</b><span>chance of a trip back</span></div>
    <p class="explain">Destinations where you'll likely drive back empty. Worst first.</p>
    <div class="ltiles">${avShown.map(avoidTile).join("")}</div>
    ${av.length > 9 ? `<button class="more" style="width:100%;margin-top:6px" data-avmore="1">${avoidExpanded ? "Show 9" : `All ${av.length} places`}</button>` : ""}</div>` : "";
  $("loops").innerHTML = hero + avoidHTML + compass + `<div class="sect">All loops by zone</div>` + groups;
}

function render() {
  if (!DATA) return;
  const nowH = currentHour(), isNow = hour === nowH;
  $("hourLabel").textContent = fmtHour(hour);
  $("hourSub").textContent = isNow ? "Now" : `${(hour - nowH + 24) % 24}h ahead`;
  $("nowBtn").disabled = isNow;

  // Loops (top of every tab) — best loop first
  const lps = (DATA.loops || []).slice().sort((a, b) => loopAt(b, hour) - loopAt(a, hour));
  $("loopsSec").innerHTML = lps.length && tab !== "loops" ? `<div class="loops-head"><b>Top loops</b><span>swipe ›</span></div>
    <div class="strip-tiles">${lps.slice(0, 10).map(loopTile).join("")}</div>` : "";
  renderLoopsTab();

  // Hot now: top venues across all areas
  const hot = [
    ...(DATA.routes || []).map(r => ({ label: `${r.from} → ${r.to}`, attr: `data-r="${esc(r.id)}"`, s: r.hourly[hour] })),
    ...(DATA.venues || []).map((v, i) => ({ label: v.name, attr: `data-v="${i}"`, s: v.hourly[hour] })),
    ...(DATA.neighborhoods || []).map(n => ({ label: n.name, attr: `data-n="${esc(n.id)}"`, s: n.hourly[hour] })),
  ].filter(x => x.s >= HIGH).sort((a, b) => b.s - a.s).slice(0, 8);
  $("hot").hidden = tab === "loops" && isNow;
  if (tab === "loops") $("hot").innerHTML = isNow ? "" : `<span class="ahead">Planning ${fmtHour(hour)}</span>`;
  else $("hot").innerHTML = (isNow ? "" : `<span class="ahead">Planning</span>`) +
    (hot.length ? `<span class="lbl">Hot</span>` + hot.map(x => `<button class="pill" ${x.attr}>${esc(x.label)}<b>${x.s}</b></button>`).join("")
                : `<span class="lbl">No high-demand spots at ${fmtHour(hour)}</span>`);

  // Compass around Temple Square + area rows
  const geo = DATA.areas.filter(a => a.direction), cats = DATA.areas.filter(a => !a.direction);
  const byDir = Object.fromEntries(geo.map(a => [a.direction, a]));
  const compass = geo.length ? `<div class="compass-wrap"><div class="compass-head"><b>Around Temple Square</b><span>~15 min drive radius</span></div>
    <div class="compass">${COMPASS.map(d => { const a = byDir[d]; if (!a) return `<div></div>`;
      const s = a.hourly[hour], lv = level(s);
      return `<button class="cell ${lv} ${d === "C" ? "center" : ""}" data-jump="${esc(a.id)}" aria-label="${esc(DIR_NAME[d])}: ${esc(a.name)}, ${s}">
        <span class="dir">${d === "C" ? "TEMPLE SQUARE" : d}</span>${gaugeSVG(s, "sm")}<span class="n">${esc(a.short || a.name)}</span><span class="d">${esc(a.drive || "")}</span></button>`; }).join("")}</div></div>` : "";
  $("areas").innerHTML = compass +
    (geo.length ? `<div class="sect">By direction</div>` + COMPASS.map(d => byDir[d]).filter(Boolean).sort((x, y) => (x.direction === "C" ? -1 : y.direction === "C" ? 1 : 0)).map(areaRow).join("") : "") +
    (cats.length ? `<div class="sect">By category</div>` + cats.map(areaRow).join("") : "");

  $("routes").innerHTML = (DATA.routes || []).length
    ? `<div class="sect">Estimated trip demand by direction</div><div class="ggrid">${byScore(DATA.routes).map(r => gcard(r, "route")).join("")}</div>` : "";
  if ((DATA.neighborhoods || []).length)
    $("areas").insertAdjacentHTML("beforeend", `<div class="sect">Neighborhoods</div><div class="ggrid">${byScore(DATA.neighborhoods).map(n => gcard(n, "hood")).join("")}</div>`);

  if (sheet) renderSheet();
}

/* ---------------- sheet: area or venue ---------------- */
function renderSheet() {
  if (sheet.type === "area") {
    const a = DATA.areas.find(x => x.id === sheet.id); if (!a) return;
    const s = a.hourly[hour], lv = level(s);
    $("sheetTitle").textContent = a.name; $("sheetSub").textContent = peakWindow(a.hourly);
    $("sheetBadge").textContent = `${s} · ${fmtHour(hour)}`; $("sheetBadge").style.cssText = `background:${bgVar(lv)};color:${color(lv)}`;
    const vs = venuesOf(a.id).sort((x, y) => y.hourly[hour] - x.hourly[hour]);
    $("sheetBody").innerHTML = `
      <div class="hero">${stripHTML(a.hourly, hour, true)}</div>
      ${a.reasons?.length ? `<div class="why"><b>Why</b><ul>${a.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
        ${a.sources?.length ? `<div class="src">Signals: ${a.sources.map(esc).join(" · ")}</div>` : ""}</div>` : ""}
      ${vs.map(v => `<div class="venue">${gaugeSVG(v.hourly[hour], "sm")}
        <div><h4>${esc(v.name)}</h4><div class="peak">${esc(v.type || "")} · ${peakWindow(v.hourly)}</div>
        ${v.note ? `<div class="note">${esc(v.note)}</div>` : ""}${stripHTML(v.hourly, hour)}</div></div>`).join("")}`;
  } else if (sheet.type === "avoid") {
    const a = (DATA.avoid || []).find(x => x.id === sheet.id); if (!a) return;
    const s = a.hourly[hour], c = avoidColor(s);
    let best = 0; a.hourly.forEach((v, i) => { if (v > a.hourly[best]) best = i; });
    $("sheetTitle").textContent = a.name;
    $("sheetSub").textContent = `~${a.miles} mi · ~${a.minutes} min from Temple Square`;
    $("sheetBadge").textContent = `Return ${s} · ${fmtHour(hour)}`; $("sheetBadge").style.cssText = `background:${cssVar(s < 25 ? "--bad-bg" : s < MED ? "--med-bg" : "--high-bg")};color:${c}`;
    const max = Math.max(...a.hourly, 1);
    $("sheetBody").innerHTML = `
      <div class="hero">${gaugeSVG(s, "lg", "avoid")}
        <div class="g-val" style="color:${c}">${s}</div>
        <div class="g-lvl" style="color:${c}">${AVOID_TXT(s)}</div>
        <div class="g-peak">Chance of a trip back · best around ${fmtHour(best)} (${a.hourly[best]})</div>
        <div class="strip tall">${a.hourly.map((v, i) => `<i class="${i === hour ? "sel" : ""}" style="height:${Math.max(8, v / max * 100)}%;background:${avoidColor(v)}"></i>`).join("")}</div>
        <div class="axis"><span>12A</span><span>6A</span><span>12P</span><span>6P</span><span>11P</span></div></div>
      ${a.note ? `<div class="why"><b>Note</b><div>${esc(a.note)}</div></div>` : ""}
      <div class="why"><b>Tip</b><div>If you take this trip, use your destination filter to head back, or plan a stop where demand is higher.</div></div>`;
  } else if (sheet.type === "loop") {
    const l = (DATA.loops || []).find(x => x.id === sheet.id); if (!l) return;
    const s = loopAt(l, hour), lv = level(s), ser = loopSeries(l);
    $("sheetTitle").textContent = l.from === l.to ? `${l.to} loop` : `${l.from} → ${l.to}`;
    $("sheetSub").textContent = `~${l.miles} mi · ~${l.minutes} min each way`;
    $("sheetBadge").textContent = `${s} · ${fmtHour(hour)}`; $("sheetBadge").style.cssText = `background:${bgVar(lv)};color:${color(lv)}`;
    $("sheetBody").innerHTML = `
      <div class="hero">${gaugeSVG(s, "lg")}
        <div class="g-val" style="color:${color(lv)}">${s}</div>
        <div class="g-lvl" style="color:${color(lv)}">Loop score · ${LEVEL_TEXT[lv]}</div>
        <div class="g-peak">${peakWindow(ser)} · ${trendTxt(ser)}</div>
        <div class="legs">
          <div><div class="lbl">${l.back ? "Out" : "In zone"} · ${esc(l.from)} → ${esc(l.to)} · ${l.hourly[hour]}</div>${stripHTML(l.hourly, hour, true)}</div>
          ${l.back ? `<div><div class="lbl">Back · ${esc(l.to)} → ${esc(l.from)} · ${l.back[hour]}</div>${stripHTML(l.back, hour, true)}</div>` : ""}
        </div></div>
      ${l.note ? `<div class="why"><b>Note</b><div>${esc(l.note)}</div></div>` : ""}`;
  } else if (sheet.type === "route" || sheet.type === "hood") {
    const isR = sheet.type === "route";
    const it = (isR ? DATA.routes : DATA.neighborhoods).find(x => x.id === sheet.id); if (!it) return;
    const s = it.hourly[hour], lv = level(s), rev = isR && it.reverse ? DATA.routes.find(x => x.id === it.reverse) : null;
    $("sheetTitle").textContent = isR ? `${it.from} → ${it.to}` : it.name;
    $("sheetSub").textContent = isR ? `~${it.miles} mi · ~${it.minutes} min` : "Neighborhood";
    $("sheetBadge").textContent = `${s} · ${fmtHour(hour)}`; $("sheetBadge").style.cssText = `background:${bgVar(lv)};color:${color(lv)}`;
    $("sheetBody").innerHTML = `
      <div class="hero">${gaugeSVG(s, "lg")}
        <div class="g-val" style="color:${color(lv)}">${s}</div>
        <div class="g-lvl" style="color:${color(lv)}">${LEVEL_TEXT[lv]}</div>
        <div class="g-peak">${peakWindow(it.hourly)} · ${trendTxt(it.hourly)}</div>
        ${stripHTML(it.hourly, hour, true)}</div>
      ${it.note ? `<div class="why"><b>Note</b><div>${esc(it.note)}</div></div>` : ""}
      ${rev ? `<button class="more" style="width:100%" data-r="${esc(rev.id)}">Return trip: ${esc(rev.from)} → ${esc(rev.to)} · ${rev.hourly[hour]}</button>` : ""}`;
  } else {
    const v = DATA.venues[sheet.id]; if (!v) return;
    const a = DATA.areas.find(x => x.id === areasOfV(v)[0]);
    const s = v.hourly[hour], lv = level(s), next = v.hourly[(hour + 1) % 24];
    $("sheetTitle").textContent = v.name; $("sheetSub").textContent = [v.type, ...areasOfV(v).map(id => DATA.areas.find(x => x.id === id)?.name)].filter(Boolean).join(" · ");
    $("sheetBadge").textContent = `${s} · ${fmtHour(hour)}`; $("sheetBadge").style.cssText = `background:${bgVar(lv)};color:${color(lv)}`;
    $("sheetBody").innerHTML = `
      <div class="hero">${gaugeSVG(s, "lg")}
        <div class="g-val" style="color:${color(lv)}">${s}</div>
        <div class="g-lvl" style="color:${color(lv)}">${LEVEL_TEXT[lv]}</div>
        <div class="g-peak">${peakWindow(v.hourly)} · ${next} next hr</div>
        ${stripHTML(v.hourly, hour, true)}</div>
      ${v.note ? `<div class="why"><b>Note</b><div>${esc(v.note)}</div></div>` : ""}
      ${a ? `<button class="more" style="width:100%" data-open-area="${esc(a.id)}">See all ${esc(a.name)} spots</button>` : ""}`;
  }
}
function openSheet(s) {
  const wasOpen = !!sheet; sheet = s; renderSheet();
  document.body.classList.add("sheet-open"); $("sheetBody").scrollTop = 0;
  if (!wasOpen) history.pushState({ sheet: 1 }, "");
}
function closeSheet(fromPop) {
  if (!sheet) return; sheet = null; document.body.classList.remove("sheet-open");
  if (!fromPop && history.state?.sheet) history.back();
}
window.addEventListener("popstate", () => closeSheet(true));
document.addEventListener("click", e => {
  if (e.target.closest("[data-lmore]")) { loopsExpanded = !loopsExpanded; render(); return; }
  if (e.target.closest("[data-avmore]")) { avoidExpanded = !avoidExpanded; render(); return; }
  const av = e.target.closest("[data-av]"); if (av) return openSheet({ type: "avoid", id: av.dataset.av });
  const lj = e.target.closest("[data-ljump]");
  if (lj) { const el = $("lg-" + lj.dataset.ljump); if (el) { el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } return; }
  const j = e.target.closest("[data-jump]");
  if (j) { const el = $("area-" + j.dataset.jump); if (el) { el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } return; }
  const b = e.target.closest("[data-a],[data-v],[data-x],[data-open-area],[data-r],[data-n],[data-l]"); if (!b) return;
  if (b.dataset.l) return openSheet({ type: "loop", id: b.dataset.l });
  if (b.dataset.r) return openSheet({ type: "route", id: b.dataset.r });
  if (b.dataset.n) return openSheet({ type: "hood", id: b.dataset.n });
  if (b.dataset.x) { expanded.has(b.dataset.x) ? expanded.delete(b.dataset.x) : expanded.add(b.dataset.x); render(); }
  else if (b.dataset.openArea) openSheet({ type: "area", id: b.dataset.openArea });
  else if (b.dataset.a) openSheet({ type: "area", id: b.dataset.a });
  else if (b.dataset.v) openSheet({ type: "venue", id: Number(b.dataset.v) });
});
$("backdrop").addEventListener("click", () => closeSheet());
$("closeSheet").addEventListener("click", () => closeSheet());
(() => { let y0 = null; const sh = $("sheet");
  sh.addEventListener("touchstart", e => { if ($("sheetBody").scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener("touchmove", e => { if (y0 === null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  sh.addEventListener("touchend", e => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; sh.style.transform = ""; y0 = null; if (dy > 90) closeSheet(); });
})();

/* ---------------- hour controls ---------------- */
const setHour = h => { hour = (h + 24) % 24; followNow = hour === currentHour(); render(); };
$("prevBtn").addEventListener("click", () => setHour(hour - 1));
$("nextBtn").addEventListener("click", () => setHour(hour + 1));
$("nowBtn").addEventListener("click", () => { followNow = true; setHour(currentHour()); });
setInterval(() => { if (followNow && inWindow() && hour !== currentHour()) { hour = currentHour(); render(); } }, 30 * 1000);

/* ---------------- refresh ---------------- */
setInterval(() => { if (inWindow()) load(); }, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { load(); if ($("wakeState").textContent === "On") requestWake(); } });
window.addEventListener("online", load);
matchMedia("(min-width: 760px)").addEventListener("change", render);

/* ---------------- menu ---------------- */
$("menuBtn").addEventListener("click", e => { e.stopPropagation(); const o = $("menu").classList.toggle("open"); $("menuBtn").setAttribute("aria-expanded", o); });
document.addEventListener("click", e => { if (!e.target.closest("#menu") && !e.target.closest("#menuBtn")) { $("menu").classList.remove("open"); $("menuBtn").setAttribute("aria-expanded", false); } });
$("refreshBtn").addEventListener("click", () => { load(); $("menu").classList.remove("open"); });
async function requestWake() {
  try { wakeLock = await navigator.wakeLock.request("screen"); $("wakeState").textContent = "On";
        wakeLock.addEventListener("release", () => { if (!document.hidden) $("wakeState").textContent = "Off"; }); }
  catch { $("wakeState").textContent = "Not supported"; }
}
$("wakeBtn").addEventListener("click", async () => {
  if (wakeLock && !wakeLock.released) { await wakeLock.release(); wakeLock = null; $("wakeState").textContent = "Off"; }
  else requestWake();
});
function applyText(t) {
  document.documentElement.dataset.text = t;
  $("textState").textContent = t === "large" ? "Large" : "Standard";
}
$("textBtn").addEventListener("click", () => { const t = document.documentElement.dataset.text === "large" ? "standard" : "large"; store.set("text", t); applyText(t); });
applyText(store.get("text") || "standard");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $("themeState").textContent = t === "light" ? "Light" : "Dark";
  document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#f3f5f6" : "#0d1012";
  syncQuickIcon();
  render();
}
$("themeBtn").addEventListener("click", () => { const t = document.documentElement.dataset.theme === "light" ? "dark" : "light"; store.set("theme", t); applyTheme(t); });

/* SLC clock + quick theme toggle (upper right) */
const SUN_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const slcTimeFmt = new Intl.DateTimeFormat("en-US", { timeZone: "America/Denver", hour: "numeric", minute: "2-digit", second: "2-digit" });
function tickClock() { const el = $("slcClock"); if (el) el.textContent = slcTimeFmt.format(new Date()) + " SLC"; }
function syncQuickIcon() {
  const btn = $("themeQuickBtn"); if (!btn) return;
  const light = document.documentElement.dataset.theme === "light";
  btn.innerHTML = light ? MOON_SVG : SUN_SVG;
  btn.setAttribute("aria-label", light ? "Switch to dark background" : "Switch to white background");
}
$("themeQuickBtn").addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  store.set("theme", t); applyTheme(t);
});
setInterval(tickClock, 1000); tickClock(); syncQuickIcon();

fetch("/cdn-cgi/access/get-identity").then(r => r.ok ? r.json() : null)
  .then(j => { if (j && j.email) $("whoami").textContent = j.email; }).catch(() => {});

setTab(tab);
applyTheme(store.get("theme") || "dark");
load();
</script>
</body>
</html>
